<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">AirPrint bridge: iPhone, Mac and USB printer</title>
  <desc id="desc">An iPhone sends a print job over Wi-Fi to a Mac, which forwards it to a USB printer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1">
      <stop offset="0" stop-color="#1e293b"/><stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".3"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12Z" fill="#67e8f9"/></marker>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <circle cx="1060" cy="90" r="130" fill="#38bdf8" opacity=".08"/><circle cx="160" cy="450" r="170" fill="#a78bfa" opacity=".08"/>
  <text x="600" y="58" text-anchor="middle" fill="#e0f2fe" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="26" font-weight="700">AirPrint bridge · impresión nativa en tu red</text>
  <g filter="url(#shadow)">
    <rect x="70" y="145" width="250" height="250" rx="24" fill="url(#card)" stroke="#475569"/>
    <rect x="475" y="145" width="250" height="250" rx="24" fill="url(#card)" stroke="#475569"/>
    <rect x="880" y="145" width="250" height="250" rx="24" fill="url(#card)" stroke="#475569"/>
  </g>
  <g fill="none" stroke="#e0f2fe" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="145" y="195" width="100" height="160" rx="18"/><line x1="177" y1="330" x2="213" y2="330"/>
    <path d="M550 320h100v-90H550zM570 210h60M570 350h60"/><circle cx="600" cy="375" r="5" fill="#67e8f9" stroke="none"/>
    <path d="M950 245h110v75H950zM965 320h80v32h-80zM970 225h70"/>
  </g>
  <g fill="#e0f2fe" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" text-anchor="middle">
    <text x="195" y="420" font-size="22" font-weight="700">iPhone / iPad</text><text x="195" y="447" font-size="15" fill="#bae6fd">Compartir → Imprimir</text>
    <text x="600" y="420" font-size="22" font-weight="700">Mac + IPP</text><text x="600" y="447" font-size="15" fill="#bae6fd">Bonjour / LaunchDaemon</text>
    <text x="1005" y="420" font-size="22" font-weight="700">Samsung M2020</text><text x="1005" y="447" font-size="15" fill="#bae6fd">USB · CUPS</text>
  </g>
  <g fill="none" stroke="#67e8f9" stroke-width="5" stroke-dasharray="10 10" marker-end="url(#arrow)"><path d="M330 270h125"/><path d="M735 270h125"/></g>
  <g fill="#67e8f9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" text-anchor="middle"><text x="392" y="245">Wi‑Fi · Bonjour</text><text x="797" y="245">IPP → USB</text></g>
</svg>
